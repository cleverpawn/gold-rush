<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#17142b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Counter">
<title>Counting App</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#17142b;color:#f2f0ff;min-height:100dvh;display:flex;flex-direction:column}
  header{background:#625bf0;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:10px}
  header input{flex:1;min-width:0;border:none;border-radius:8px;padding:10px 12px;font-size:18px;font-weight:600;color:#241f5e;background:#fff;outline:none}
  #resetBtn{border:1px solid rgba(255,255,255,.75);background:transparent;color:#fff;border-radius:999px;padding:9px 14px;font-size:15px;font-weight:600;cursor:pointer}
  .mid{padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  #num{font-size:84px;line-height:1;font-weight:400;color:#e6e3ff;min-width:100px;text-align:center;flex:1}
  #minusBtn{width:88px;height:88px;flex:0 0 88px;border-radius:50%;border:none;background:#d9d6f5;color:#3b33c4;font-size:58px;line-height:1;font-weight:700;cursor:pointer}
  #minusBtn:active{transform:scale(.96)}
  #plusBtn{display:block;width:calc(100% - 28px);margin:6px 14px 14px;flex:1;min-height:220px;border:none;border-radius:28px;background:#d9d6f5;color:#3b33c4;font-size:110px;font-weight:700;cursor:pointer}
  #plusBtn:active{transform:scale(.99);background:#c9c4f2}
  .steps{display:flex;gap:8px;justify-content:center;padding:0 14px 12px}
  .steps button{border:1px solid #4f46c8;background:#221e42;color:#cfc9ff;border-radius:999px;padding:8px 16px;font-size:15px;font-weight:600;cursor:pointer}
  .steps button.on{background:#625bf0;color:#fff;border-color:#625bf0}
  #saveBtn{display:block;width:calc(100% - 28px);margin:0 14px 14px;padding:15px;border:none;border-radius:14px;background:#625bf0;color:#fff;font-size:18px;font-weight:700;cursor:pointer}
  #saveBtn:active{transform:scale(.99)}
  .saved{padding:2px 16px calc(18px + env(safe-area-inset-bottom))}
  .saved h2{margin:6px 0 8px;font-size:15px;color:#bdb6f5;font-weight:700}
  .row{display:flex;align-items:center;gap:10px;background:#221e42;border:1px solid #37316e;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:15px}
  .row b{color:#fff;font-size:19px}
  .row .when{color:#a49cd8;font-size:12px;display:block}
  .row button{margin-left:auto;border:none;background:transparent;color:#a49cd8;font-size:14px;font-weight:600;cursor:pointer;padding:6px}
  .empty{color:#a49cd8;font-size:14px}
  button:focus-visible,input:focus-visible{outline:3px solid #ffb020;outline-offset:2px}
</style>
</head>
<body>
<header>
  <input id="label" type="text" value="Count" maxlength="40" aria-label="Counter name">
  <button id="resetBtn" type="button">Reset</button>
</header>

<div class="mid">
  <div id="num" aria-live="polite">0</div>
  <button id="minusBtn" type="button" aria-label="Subtract">&minus;</button>
</div>

<button id="plusBtn" type="button" aria-label="Add">+</button>

<div class="steps" role="group" aria-label="Count by">
  <button type="button" data-step="1" class="on">+1</button>
  <button type="button" data-step="2">+2</button>
  <button type="button" data-step="5">+5</button>
  <button type="button" data-step="10">+10</button>
</div>

<button id="saveBtn" type="button">Save result</button>

<div class="saved">
  <h2>Saved results</h2>
  <div id="savedList"><div class="empty">None saved yet.</div></div>
</div>

<script>
(function(){
  var KEY = "counting-app-v1";
  var state = {count:0, label:"Count", step:1, saved:[]};
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (parsed && typeof parsed.count === "number") state = parsed;
      if (!state.saved) state.saved = [];
      if (!state.step) state.step = 1;
    }
  } catch(e){}

  var num = document.getElementById('num');
  var label = document.getElementById('label');
  var list = document.getElementById('savedList');

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function buzz(){ try{ if(navigator.vibrate) navigator.vibrate(10); }catch(e){} }

  function render(){
    num.textContent = String(state.count);
    if (document.activeElement !== label) label.value = state.label || "Count";
    var btns = document.querySelectorAll('.steps button');
    for (var i=0;i<btns.length;i++){
      btns[i].classList.toggle('on', Number(btns[i].getAttribute('data-step')) === state.step);
    }
    if (!state.saved.length){ list.innerHTML = '<div class="empty">None saved yet.</div>'; return; }
    var html = "";
    state.saved.forEach(function(r, idx){
      html += '<div class="row"><div><b>' + r.count + '</b> &nbsp;' + esc(r.label) + '<span class="when">' + esc(r.when) + '</span></div><button type="button" data-i="' + idx + '">Remove</button></div>';
    });
    list.innerHTML = html;
    var rm = list.querySelectorAll('button');
    for (var j=0;j<rm.length;j++){
      rm[j].addEventListener('click', function(ev){
        state.saved.splice(Number(ev.currentTarget.getAttribute('data-i')), 1);
        persist(); render();
      });
    }
  }

  document.getElementById('plusBtn').addEventListener('click', function(){
    state.count += state.step; buzz(); persist(); render(); keepAwake();
  });
  document.getElementById('minusBtn').addEventListener('click', function(){
    state.count = Math.max(0, state.count - state.step); buzz(); persist(); render();
  });
  document.getElementById('resetBtn').addEventListener('click', function(){
    if (state.count === 0) return;
    if (confirm('Reset the count to 0?')) { state.count = 0; persist(); render(); }
  });
  document.getElementById('saveBtn').addEventListener('click', function(){
    var now = new Date();
    var when = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    state.saved.unshift({label:(state.label || "Count"), count: state.count, when: when});
    buzz(); persist(); render();
    var b = document.getElementById('saveBtn');
    var old = b.textContent; b.textContent = 'Saved ✓';
    setTimeout(function(){ b.textContent = old; }, 1200);
  });
  label.addEventListener('input', function(){ state.label = label.value; persist(); });
  var stepBtns = document.querySelectorAll('.steps button');
  for (var k=0;k<stepBtns.length;k++){
    stepBtns[k].addEventListener('click', function(ev){
      state.step = Number(ev.currentTarget.getAttribute('data-step')); persist(); render();
    });
  }

  var wakeLock = null;
  function keepAwake(){
    try {
      if (navigator.wakeLock && !wakeLock) {
        navigator.wakeLock.request('screen').then(function(wl){
          wakeLock = wl;
          wl.addEventListener('release', function(){ wakeLock = null; });
        }).catch(function(){});
      }
    } catch(e){}
  }
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') keepAwake();
  });

  render();
})();
</script>
</body>
</html>
